<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Company</title>

  <style>
    /* Basic reset */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background-image: url("overlook_bckg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
      font-family: sans-serif;
    }

    /* Optional subtle overlay for readability (delete if not needed) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.15);
      pointer-events: none;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 48px);
      position: relative;
    }

    .logo {
      width: min(520px, 80vw);
      height: auto;
      max-height: 60vh;
      object-fit: contain;
    }

    /* Mobile fix for background scrolling */
    @media (max-width: 768px) {
      body { background-attachment: scroll; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img class="logo" src="Logo_White.png" alt="Company Logo" />
  </main>
</body>
</html>
